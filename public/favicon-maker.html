<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Favicon Maker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .favicon {
      width: 512px;
      height: 512px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFE8DF 0%, #DDF7F5 100%);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .favicon img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
    }
  </style>
</head>
<body>
  <div class="favicon" id="favicon">
    <img src="/nafi-3d-transparent.png" alt="Nafi">
  </div>
</body>
</html>
